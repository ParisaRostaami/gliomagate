name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Train if weights missing
        run: |
          if [ ! -f models/segmenter.joblib ]; then python scripts/train.py; fi
      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Docker build
        run: docker build -t gliomagate:ci .
