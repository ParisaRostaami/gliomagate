<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GliomaGate — grounded neuro-oncology inference</title>
  <style>
    :root { --ink:#102033; --muted:#5b6b7c; --line:#d7dee6; --bg:#f6f8fb; --card:#fff; --good:#0f766e; --bad:#b42318; --warn:#b45309; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:28px 22px 10px; max-width:1100px; margin:0 auto; }
    h1 { font-size:1.55rem; letter-spacing:-.03em; margin:0 0 6px; }
    .sub { color:var(--muted); max-width:70ch; line-height:1.5; }
    main { max-width:1100px; margin:0 auto; padding:12px 22px 60px; display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
    label { font-size:.78rem; font-weight:600; color:var(--muted); display:block; margin:10px 0 6px; }
    textarea, input { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
    textarea { min-height:120px; resize:vertical; }
    button { background:var(--ink); color:#fff; border:0; border-radius:999px; padding:10px 16px; font-weight:600; cursor:pointer; }
    button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    img.view { width:100%; border-radius:10px; background:#0b1220; }
    .field { border-top:1px solid var(--line); padding:10px 0; }
    .field:first-child { border-top:0; }
    .tag { font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:999px; }
    .image { background:#ccfbf1; color:#115e59; }
    .retrieval { background:#e0e7ff; color:#3730a3; }
    .ungrounded { background:#fee4e2; color:#7a271a; }
    .hit { font-size:.86rem; color:var(--muted); margin:8px 0; }
    .lat { font-family: ui-monospace, monospace; font-size:.8rem; color:var(--muted); }
    @media (max-width:860px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>GliomaGate</h1>
    <p class="sub">
      Upload an MRI slice (or load a synthetic sample) plus a neuro-oncology note.
      The service returns a tumor mask, a structured report, and an <b>evidence ledger</b>:
      every field must be grounded in the image or a retrieved guideline — otherwise it is flagged.
    </p>
  </header>
  <main>
    <section class="card">
      <label>Clinical note</label>
      <textarea id="note" placeholder="Neuro-oncology consult..."></textarea>
      <label>MRI slice (png/jpg, optional if you load a sample)</label>
      <input id="file" type="file" accept="image/*" />
      <div class="row">
        <button id="sample" class="ghost" type="button">Load sample</button>
        <button id="run" type="button">Run inference</button>
      </div>
      <p class="lat" id="status">Ready.</p>
      <div style="margin-top:12px">
        <img class="view" id="preview" alt="slice preview" />
      </div>
    </section>
    <section class="card">
      <img class="view" id="mask" alt="mask overlay" />
      <p class="lat" id="latency"></p>
      <div id="ledger"></div>
      <h3>Retrieved guidelines</h3>
      <div id="hits"></div>
    </section>
  </main>
  <script>
    let seed = 0;
    const note = document.getElementById('note');
    const file = document.getElementById('file');
    const preview = document.getElementById('preview');
    const mask = document.getElementById('mask');
    const ledger = document.getElementById('ledger');
    const hits = document.getElementById('hits');
    const latency = document.getElementById('latency');
    const status = document.getElementById('status');

    document.getElementById('sample').onclick = async () => {
      seed += 1;
      const r = await fetch('/v1/sample?seed=' + seed);
      const j = await r.json();
      note.value = j.note;
      preview.src = 'data:image/png;base64,' + j.image_png;
      status.textContent = 'Sample seed ' + seed + ' loaded (synthetic T1c-like slice).';
    };

    document.getElementById('run').onclick = async () => {
      status.textContent = 'Running…';
      const fd = new FormData();
      fd.append('note', note.value);
      if (file.files[0]) fd.append('image', file.files[0]);
      else fd.append('seed', String(seed || 1));
      const t0 = performance.now();
      const r = await fetch('/v1/infer', { method: 'POST', body: fd });
      const j = await r.json();
      if (!r.ok) { status.textContent = j.detail || 'error'; return; }
      mask.src = 'data:image/png;base64,' + j.mask_png;
      preview.src = 'data:image/png;base64,' + j.source_png;
      latency.textContent = 'p_request ' + j.latency_ms + ' ms  ·  client ' + (performance.now()-t0).toFixed(0) + ' ms';
      ledger.innerHTML = Object.entries(j.report.fields).map(([k,v]) => `
        <div class="field">
          <div><b>${k}</b> → ${v.value}
            <span class="tag ${v.provenance}">${v.provenance}</span>
            <span class="lat">${(v.confidence*100).toFixed(0)}%</span>
          </div>
          <div class="lat">${(v.evidence||[]).join(' · ')}</div>
        </div>`).join('') + (j.report.contradictions.length
          ? `<div class="field"><span class="tag ungrounded">contradiction</span> ${JSON.stringify(j.report.contradictions)}</div>`
          : '');
      hits.innerHTML = j.retrieval.map(h => `<div class="hit"><b>${h.title}</b> (${h.score})<br>${h.text}</div>`).join('');
      status.textContent = 'Grounded fraction ' + j.report.grounded_fraction;
    };
    document.getElementById('sample').click();
  </script>
</body>
</html>
